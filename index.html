<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>探索地域</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f7f7f7}
header{height:58px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #ddd;position:relative;z-index:1000}
h1{font-size:20px;margin:0}.btn{border:0;border-radius:12px;padding:10px 13px;background:#111;color:white;font-weight:600}
#map{height:calc(100vh - 58px);width:100%}
.panel{position:fixed;left:12px;right:12px;bottom:12px;background:rgba(255,255,255,.96);border-radius:18px;padding:12px;box-shadow:0 4px 25px #0002;z-index:2000}
.hint{text-align:center;font-size:12px;color:#666;margin-bottom:9px}
.row{display:flex;gap:8px}.row .btn{flex:1}
.modal{position:fixed;inset:0;background:#0005;z-index:3000;display:none;align-items:flex-end}
.sheet{background:white;border-radius:22px 22px 0 0;padding:18px;width:100%;max-height:75vh;overflow:auto}
.sheet h2{margin:0 0 12px}.item{padding:12px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px}
.small{font-size:12px;color:#777}.star{color:#d89b00;font-weight:700}.danger{color:#c00;border:0;background:none}
</style>
</head>
<body>
<header><h1>探索地域</h1><button class="btn" onclick="openList()">一覧</button></header>
<div id="map"></div>
<div class="panel">
  <div class="hint">地図をタップすると「探索地域」を追加</div>
  <div class="row">
    <button class="btn" onclick="randomNext()">次の目的地を決める</button>
    <button class="btn" onclick="locate()">現在地</button>
  </div>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <h2>探索地域</h2>
    <div id="list"></div>
    <button class="btn" style="width:100%;margin-top:14px" onclick="closeModal()">閉じる</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY="exploration_places_v1";
let places=JSON.parse(localStorage.getItem(KEY)||"[]");
let map=L.map("map").setView([35.6762,139.6503],6);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
let markers={};

function save(){localStorage.setItem(KEY,JSON.stringify(places))}
function icon(next){
 return L.divIcon({className:"",html:`<div style="font-size:32px;text-shadow:0 2px 4px #0006">${next?"⭐":"📍"}</div>`,iconSize:[36,36],iconAnchor:[18,34]})
}
function render(){
 Object.values(markers).forEach(m=>map.removeLayer(m)); markers={};
 places.forEach(p=>{
   let m=L.marker([p.lat,p.lng],{icon:icon(p.next)}).addTo(map);
   m.bindPopup(`<b>${p.next?"⭐ 次の目的地":"📍 探索地域"}</b><br><small>${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</small><br><br><button onclick="setNext('${p.id}')">次の目的地にする</button> <button onclick="toggleVisited('${p.id}')">${p.visited?"未探索に戻す":"探索済みにする"}</button>`);
   markers[p.id]=m;
 })
}
map.on("click",e=>{
 const p={id:crypto.randomUUID(),lat:e.latlng.lat,lng:e.latlng.lng,next:false,visited:false};
 places.push(p); save(); render();
 markers[p.id].openPopup();
});
function setNext(id){places.forEach(p=>p.next=p.id===id);save();render();openList()}
function toggleVisited(id){let p=places.find(x=>x.id===id);if(p)p.visited=!p.visited;save();render()}
function randomNext(){
 let a=places.filter(p=>!p.visited);
 if(!a.length){alert("未探索の探索地域がありません");return}
 setNext(a[Math.floor(Math.random()*a.length)].id);
 let p=places.find(x=>x.next); map.setView([p.lat,p.lng],14);
}
function locate(){
 if(!navigator.geolocation){alert("現在地取得に対応していません");return}
 navigator.geolocation.getCurrentPosition(pos=>map.setView([pos.coords.latitude,pos.coords.longitude],14),()=>alert("現在地を取得できませんでした"))
}
function openList(){
 let el=document.getElementById("list");
 if(!places.length) el.innerHTML='<p class="small">まだ探索地域がありません。地図をタップしてください。</p>';
 else el.innerHTML=places.map(p=>`
 <div class="item">
 <div><b>${p.next?"⭐ ":"📍 "}探索地域</b><div class="small">${p.visited?"探索済み":"未探索"} ・ ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</div></div>
 <div><button onclick="setNext('${p.id}')">${p.next?"選択中":"次へ"}</button>
 <button class="danger" onclick="del('${p.id}')">削除</button></div>
 </div>`).join("");
 document.getElementById("modal").style.display="flex";
}
function del(id){places=places.filter(p=>p.id!==id);save();render();openList()}
function closeModal(){document.getElementById("modal").style.display="none"}
render();
</script>
</body>
</html>
