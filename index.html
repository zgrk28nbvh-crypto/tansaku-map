<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>探索地域 // QUEST LOG</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --hud:#9cff8a; --hud2:#d8ffd0; --bg:#071008; --panel:#0a160b;
  --line:#6fc962; --dim:#578b50; --danger:#ff7565;
}
*{box-sizing:border-box}
html,body,#map{margin:0;width:100%;height:100%;font-family:"Courier New",monospace}
body{overflow:hidden;background:#071008;color:var(--hud)}
#map{position:fixed;inset:0;filter:saturate(.75) contrast(1.02)}
.leaflet-tile{filter:saturate(.65) sepia(.25) hue-rotate(55deg) brightness(.9)}
.hud::before{
 content:"";position:fixed;inset:0;z-index:1200;pointer-events:none;
 background:repeating-linear-gradient(to bottom,rgba(160,255,130,.035) 0 1px,transparent 1px 4px);
}
.hud::after{
 content:"";position:fixed;inset:0;z-index:1201;pointer-events:none;
 box-shadow:inset 0 0 90px rgba(0,20,0,.7);
}
.panel{
 position:fixed;z-index:1300;left:14px;top:14px;bottom:14px;width:min(355px,calc(100vw - 28px));
 background:rgba(5,15,7,.94);border:1px solid var(--line);
 box-shadow:0 0 0 1px rgba(156,255,138,.16),0 0 24px rgba(90,220,80,.18);
 display:flex;flex-direction:column;
}
.panel:before,.panel:after{content:"";position:absolute;width:18px;height:18px;border-color:var(--hud);border-style:solid;pointer-events:none}
.panel:before{left:-1px;top:-1px;border-width:2px 0 0 2px}.panel:after{right:-1px;bottom:-1px;border-width:0 2px 2px 0}
.header{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.kicker{font-size:11px;letter-spacing:2px;color:var(--dim)}
.title{font-size:24px;font-weight:bold;letter-spacing:1px;margin-top:3px;text-shadow:0 0 8px rgba(156,255,138,.45)}
.status{display:flex;justify-content:space-between;font-size:11px;margin-top:10px;color:var(--hud2)}
.list{overflow:auto;flex:1;padding:8px}
.quest{
 border:1px solid transparent;padding:11px 10px;margin-bottom:6px;cursor:pointer;
 background:rgba(110,200,90,.04);position:relative;
}
.quest:hover,.quest.active{border-color:var(--line);background:rgba(110,200,90,.11)}
.quest .qtitle{font-size:15px;color:var(--hud2);padding-left:17px}
.quest .qmeta{font-size:10px;color:var(--dim);margin-top:5px;padding-left:17px}
.quest:before{content:"□";position:absolute;left:8px;top:9px;font-size:15px}
.quest.next:before{content:"◆";font-size:11px;top:11px}
.quest.done .qtitle{text-decoration:line-through;color:var(--dim)}
.quest.done:before{content:"■";font-size:10px;top:12px}
.empty{padding:25px 12px;text-align:center;color:var(--dim);font-size:12px;line-height:1.8}
.actions{padding:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:7px}
button{
 font-family:inherit;font-weight:bold;color:var(--hud);background:#0b1c0d;
 border:1px solid var(--line);padding:11px 8px;cursor:pointer
}
button:active{background:#17351a}
.map-hint{
 position:fixed;z-index:1250;right:16px;top:16px;
 color:var(--hud);background:rgba(5,15,7,.82);border:1px solid var(--line);
 padding:9px 12px;font-size:11px
}
.modal{
 display:none;position:fixed;z-index:2000;inset:0;background:rgba(0,0,0,.62);
 align-items:center;justify-content:center;padding:20px
}
.dialog{width:min(390px,100%);background:#071008;border:1px solid var(--line);box-shadow:0 0 30px rgba(80,230,70,.22);padding:18px}
.dialog h2{font-size:18px;margin:0 0 12px}
.dialog input{
 width:100%;background:#030803;border:1px solid var(--line);color:var(--hud2);
 padding:13px;font:16px "Courier New",monospace;outline:none
}
.dialog .buttons{display:flex;gap:8px;margin-top:12px}.dialog button{flex:1}
.popup{font-family:"Courier New",monospace;color:#183018}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#d8ffd0}
.pin{
 width:18px;height:18px;border:2px solid #071008;border-radius:50%;
 background:var(--hud);box-shadow:0 0 0 2px var(--hud),0 0 12px var(--hud)
}
@media(max-width:700px){
 .panel{top:10px;left:10px;bottom:auto;width:calc(100vw - 20px);height:auto;max-height:56vh}
 .panel.collapsed{max-height:64px}
 .panel.collapsed .list,.panel.collapsed .actions,.panel.collapsed .status{display:none}
 .header{cursor:pointer}
 .map-hint{top:auto;right:10px;bottom:12px;font-size:10px}
 .title{font-size:20px}
 .list{max-height:31vh}
}

#questHUD .sectionLabel{font-size:11px;letter-spacing:2px;margin:10px 0 4px;padding-bottom:4px;border-bottom:1px solid rgba(140,255,102,.22)}
#questHUD .sideLabel{margin-top:14px;opacity:.9}
#questType{width:100%;box-sizing:border-box;background:#020802;color:var(--pip);border:1px solid rgba(140,255,102,.7);padding:8px;margin-bottom:6px;font-family:inherit}
</style>
</head>
<body class="hud">
<div id="map"></div>

<section class="panel" id="panel">
  <div class="header" id="header">
    <div class="kicker">EXPLORATION TERMINAL // FIELD LOG</div>
    <div class="title">QUEST LOG</div>
    <div class="status"><span id="count">0 QUESTS</span><span id="nextStatus">NO ACTIVE QUEST</span></div>
  </div>
  <div class="list" id="list"></div>
  <div class="actions">
    <button id="randomBtn">NEXT QUEST</button>
    <button id="clearBtn">CLEAR DONE</button>
  </div>
</section>
<div class="map-hint">MAP TAP → NEW QUEST</div>

<div class="modal" id="modal">
  <div class="dialog">
    <h2 id="modalTitle">NEW EXPLORATION QUEST</h2>
    <input id="nameInput" maxlength="40" placeholder="例：角島の廃墟 / 山奥の滝">
    <div class="buttons">
      <button id="cancelBtn">CANCEL</button>
      <button id="saveBtn">ADD QUEST</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY="exploration_map_v3";
let places=JSON.parse(localStorage.getItem(KEY)||"[]");
places=places.map((p,i)=>({...p,id:p.id||("q"+Date.now()+i),name:p.name||"探索地域 "+(i+1)}));

const map=L.map("map").setView([34.1785,131.4737],9);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);

const markers=new Map();
const panel=document.getElementById("panel");
const list=document.getElementById("list");
const modal=document.getElementById("modal");
const input=document.getElementById("nameInput");

function save(){localStorage.setItem(KEY,JSON.stringify(places));}
function icon(){
 return L.divIcon({className:"",html:'<div class="pin"></div>',iconSize:[18,18],iconAnchor:[9,9],popupAnchor:[0,-10]});
}
function render(){
 markers.forEach(m=>m.remove());markers.clear();
 list.innerHTML="";
 const next=places.find(p=>p.next);
 document.getElementById("count").textContent=places.length+" QUEST"+(places.length===1?"":"S");
 document.getElementById("nextStatus").textContent=next?("ACTIVE: "+next.name.toUpperCase()):"NO ACTIVE QUEST";

 if(!places.length){
   list.innerHTML='<div class="empty">探索地域はまだ登録されていません。<br>地図上の気になる場所をタップしてください。</div>';
   return;
 }
 places.forEach(p=>{
   const m=L.marker([p.lat,p.lng],{icon:icon()}).addTo(map);
   const status=p.next?"★ ACTIVE":"";
   m.bindPopup(`<div class="popup"><b>${escapeHtml(p.name)}</b><br><small>${status||"探索地域"}</small><br><br><button onclick="setNext('${p.id}')">${p.next?"ACTIVE":"SET NEXT"}</button> <button onclick="editQuest('${p.id}')">RENAME</button></div>`);
   markers.set(p.id,m);

   const el=document.createElement("div");
   el.className="quest "+(p.next?"next ":"")+(p.visited?"done ":"");
   el.innerHTML=`<div class="qtitle">${escapeHtml(p.name)}</div><div class="qmeta">${p.visited?"COMPLETED":"UNEXPLORED"} · ${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</div>`;
   el.onclick=()=>{document.querySelectorAll(".quest").forEach(x=>x.classList.remove("active"));el.classList.add("active");map.setView([p.lat,p.lng],14);markers.get(p.id).openPopup();};
   el.oncontextmenu=e=>{e.preventDefault();editQuest(p.id);};
   list.appendChild(el);
 });
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function openNew(latlng){
 modal.dataset.lat=latlng.lat;modal.dataset.lng=latlng.lng;
 document.getElementById("modalTitle").textContent="NEW EXPLORATION QUEST";
 document.getElementById("saveBtn").textContent="ADD QUEST";
 input.value="";modal.style.display="flex";setTimeout(()=>input.focus(),50);
}
function editQuest(id){
 const p=places.find(x=>x.id===id);if(!p)return;
 modal.dataset.id=id;modal.dataset.lat="";modal.dataset.lng="";
 document.getElementById("modalTitle").textContent="RENAME QUEST";
 document.getElementById("saveBtn").textContent="SAVE";
 input.value=p.name;modal.style.display="flex";setTimeout(()=>{input.focus();input.select()},50);
}
window.editQuest=editQuest;
window.setNext=function(id){
 places.forEach(p=>p.next=p.id===id);save();render();
 const p=places.find(p=>p.id===id);if(p){map.setView([p.lat,p.lng],14);markers.get(id).openPopup();}
};
map.on("click",e=>openNew(e.latlng));

document.getElementById("saveBtn").onclick=()=>{
 const name=input.value.trim()||"探索地域";
 if(modal.dataset.id){
   const p=places.find(x=>x.id===modal.dataset.id);if(p)p.name=name;
 }else{
   places.push({id:crypto.randomUUID(),lat:+modal.dataset.lat,lng:+modal.dataset.lng,name,next:false,visited:false});
 }
 save();render();modal.style.display="none";
 delete modal.dataset.id;
};
document.getElementById("cancelBtn").onclick=()=>modal.style.display="none";
modal.onclick=e=>{if(e.target===modal)modal.style.display="none"};
input.onkeydown=e=>{if(e.key==="Enter")document.getElementById("saveBtn").click()};

document.getElementById("randomBtn").onclick=()=>{
 const candidates=places.filter(p=>!p.visited);
 if(!candidates.length){alert("未探索のクエストがありません。");return;}
 const p=candidates[Math.floor(Math.random()*candidates.length)];
 places.forEach(x=>x.next=x.id===p.id);save();render();map.setView([p.lat,p.lng],14);markers.get(p.id).openPopup();
};
document.getElementById("clearBtn").onclick=()=>{
 places=places.filter(p=>!p.visited);save();render();
};
document.getElementById("header").onclick=()=>{
 if(innerWidth<=700)panel.classList.toggle("collapsed");
};
render();
</script>

<style>
:root{
  --pip:#8cff66; --pip2:#5fcf3e; --bg:#071006; --panel:rgba(5,16,6,.88);
}
body{background:#020602!important;color:var(--pip)!important;}
#questHUD{
 position:fixed;left:12px;top:18px;width:min(330px,78vw);z-index:9999;
 font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
 color:var(--pip);text-shadow:0 0 8px rgba(140,255,102,.55);
 pointer-events:none;
}
#questHUD .qbox{max-height:78vh;overflow-y:auto;background:var(--panel);border:1px solid rgba(140,255,102,.6);
 box-shadow:0 0 18px rgba(60,255,60,.12),inset 0 0 25px rgba(60,255,60,.05);
 padding:12px;pointer-events:auto;backdrop-filter:blur(5px);}
#questHUD .title{font-size:12px;letter-spacing:3px;border-bottom:1px solid rgba(140,255,102,.45);
 padding-bottom:8px;margin-bottom:8px}
.qitem{padding:8px 6px;border-left:3px solid transparent;margin:4px 0;cursor:pointer}
.qitem:hover{background:rgba(140,255,102,.08);border-left-color:var(--pip)}
.qitem.main{border-left-color:var(--pip)}
.qitem.done{opacity:.45;text-decoration:line-through}
.qmeta{font-size:10px;opacity:.7;margin-top:3px}
#questHUD button{background:#081508;color:var(--pip);border:1px solid var(--pip);
 padding:7px 9px;margin:3px 2px;font-family:inherit;cursor:pointer}
#questHUD button:hover{background:#102610}
#questForm{display:none;margin-top:8px}
#questName{width:100%;box-sizing:border-box;background:#020802;color:var(--pip);
 border:1px solid rgba(140,255,102,.7);padding:9px;font-family:inherit}
#questHUD .status{font-size:10px;margin:8px 0;opacity:.8}

#questHUD .sectionLabel{font-size:11px;letter-spacing:2px;margin:10px 0 4px;padding-bottom:4px;border-bottom:1px solid rgba(140,255,102,.22)}
#questHUD .sideLabel{margin-top:14px;opacity:.9}
#questType{width:100%;box-sizing:border-box;background:#020802;color:var(--pip);border:1px solid rgba(140,255,102,.7);padding:8px;margin-bottom:6px;font-family:inherit}
</style>
<div id="questHUD">
 <div class="qbox">
  <div class="title">▣ QUEST LOG // EXPLORATION</div>
  <div class="sectionLabel mainLabel">◆ MAIN QUESTS</div>
  <div id="mainQuestList"></div>
  <div class="sectionLabel sideLabel">◇ SIDE QUESTS</div>
  <div id="sideQuestList"></div>
  <div class="status" id="questStatus">NO ACTIVE QUEST</div>
  <button id="addQuestBtn">＋ ADD REGION</button>
  <button id="nextQuestBtn">NEXT QUEST</button>
  <div id="questForm">
    <select id="questType">
      <option value="main">MAIN QUEST — 重要な探索</option>
      <option value="side">SIDE QUEST — 寄り道・気になる場所</option>
    </select>
    <input id="questName" maxlength="40" placeholder="探索地域の名前を入力">
    <button id="saveQuestBtn">REGISTER</button>
    <button id="cancelQuestBtn">CANCEL</button>
  </div>
 </div>
</div>
<script>
(function(){
 const KEY="tansakuQuestV2";
 let quests=[];
 try{quests=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){quests=[]}
 let pending=null;
 const $=id=>document.getElementById(id);
 function save(){localStorage.setItem(KEY,JSON.stringify(quests));render();}
 function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
 function render(){
   const main=$("mainQuestList"), side=$("sideQuestList");
   const make=(q,i)=>`
    <div class="qitem ${q.done?'done':''}" data-i="${i}">
      ${q.type==="side"?'◇':'◆'} ${esc(q.name)}
      <div class="qmeta">${q.done?'[ COMPLETE ]':(q.type==="side"?'[ SIDE QUEST ]':'[ MAIN QUEST ]')} ${q.date||''}</div>
    </div>`;
   const mains=quests.map((q,i)=>[q,i]).filter(x=>(x[0].type||"main")==="main");
   const sides=quests.map((q,i)=>[q,i]).filter(x=>x[0].type==="side");
   main.innerHTML=mains.length?mains.map(x=>make(x[0],x[1])).join(""):'<div class="qmeta">› MAIN QUESTなし</div>';
   side.innerHTML=sides.length?sides.map(x=>make(x[0],x[1])).join(""):'<div class="qmeta">› SIDE QUESTなし</div>';
   document.querySelectorAll("#mainQuestList .qitem,#sideQuestList .qitem").forEach(el=>el.onclick=()=>{
      const q=quests[+el.dataset.i];
      if(q.done){
        if(confirm("この探索地域を未探索に戻しますか？")){q.done=false;save();}
        return;
      }
      quests.forEach(x=>x.main=false); q.main=true; save();
      if(window.focusQuest) window.focusQuest(q);
      $("questStatus").textContent="ACTIVE: "+q.name;
   });
 } 
 $("addQuestBtn").onclick=()=>{
   pending=true;$("questForm").style.display="block";$("questName").focus();
   $("questStatus").textContent="MAPをタップして地点を決めるか、既存の地点を選択";
 };
 $("cancelQuestBtn").onclick=()=>{$("questForm").style.display="none";pending=null;};
 $("saveQuestBtn").onclick=()=>{
   const name=$("questName").value.trim();
   if(!name)return;
   let lat=null,lng=null;
   if(window.lastMapClick){lat=window.lastMapClick.lat;lng=window.lastMapClick.lng;}
   quests.push({name,lat,lng,done:false,main:true,type:$("questType").value,date:new Date().toLocaleDateString("ja-JP")});
   quests.forEach((q,i)=>{if(i!==quests.length-1)q.main=false});
   $("questName").value="";$("questForm").style.display="none";pending=null;save();
   if(window.focusQuest)window.focusQuest(quests[quests.length-1]);
 };
 $("nextQuestBtn").onclick=()=>{
   const pool=quests.filter(q=>!q.done);
   if(!pool.length){$("questStatus").textContent="ALL QUESTS COMPLETE";return;}
   const q=pool[Math.floor(Math.random()*pool.length)];
   quests.forEach(x=>x.main=false);q.main=true;save();
   $("questStatus").textContent="NEXT: "+q.name;
   if(window.focusQuest)window.focusQuest(q);
 };
 window.completeQuest=function(i){if(quests[i]){quests[i].done=true;quests[i].main=false;save();}};
 window.getQuestData=()=>quests;
 render();

 // Leaflet地図ならクリック位置を自動取得
 setTimeout(()=>{
   if(window.map && window.L){
     map.on("click",e=>{
       window.lastMapClick={lat:e.latlng.lat,lng:e.latlng.lng};
       if(pending){
         $("questForm").style.display="block";
         $("questStatus").textContent="地点設定済み — 名前を入力";
         $("questName").focus();
       }
     });
     window.focusQuest=function(q){
       if(q.lat!=null && q.lng!=null && map.setView) map.setView([q.lat,q.lng],15);
     };
   }
 },800);
})();
</script>

</body>
</html>
