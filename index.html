<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>探索地域</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{overflow:hidden}
header{height:58px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box;position:relative;z-index:1000;border-bottom:1px solid #ddd}
h1{font-size:20px;margin:0}
button{border:0;border-radius:12px;padding:10px 14px;background:#111;color:#fff;font-weight:600}
#map{height:calc(100vh - 58px);width:100%}
.bottom{position:absolute;z-index:1000;left:12px;right:12px;bottom:14px;background:#fffffff2;border-radius:18px;padding:11px;box-shadow:0 4px 22px #0003}
.hint{text-align:center;color:#666;font-size:12px;margin-bottom:8px}
.row{display:flex;gap:8px}.row button{flex:1}
.sheet{display:none;position:fixed;z-index:3000;inset:0;background:#0006;align-items:flex-end}
.box{background:#fff;width:100%;max-height:75%;overflow:auto;border-radius:22px 22px 0 0;padding:18px;box-sizing:border-box}
.item{display:flex;justify-content:space-between;gap:8px;padding:13px 0;border-bottom:1px solid #eee}
.meta{font-size:12px;color:#777;margin-top:4px}
.item button{font-size:12px;padding:8px}
.next{color:#d59a00;font-weight:700}
</style>
</head>
<body>
<header><h1>探索地域</h1><button id="listBtn">一覧</button></header>
<div id="map"></div>
<div class="bottom">
  <div class="hint">地図をタップすると「探索地域」を追加</div>
  <div class="row">
    <button id="randomBtn">次の目的地を決める</button>
    <button id="locBtn">現在地</button>
  </div>
</div>
<div class="sheet" id="sheet">
  <div class="box">
    <h2>探索地域一覧</h2>
    <div id="items"></div>
    <button id="closeBtn" style="width:100%;margin-top:12px">閉じる</button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY="exploration_map_v3";
let places=JSON.parse(localStorage.getItem(KEY)||"[]");
const map=L.map("map").setView([34.1785,131.4737],8);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
 maxZoom:19,
 attribution:"© OpenStreetMap contributors"
}).addTo(map);

const markers=new Map();

function save(){localStorage.setItem(KEY,JSON.stringify(places));}
function render(){
 markers.forEach(m=>m.remove()); markers.clear();
 places.forEach(p=>{
   const marker=L.marker([p.lat,p.lng]).addTo(map);
   marker.bindPopup(`
     <b>${p.next?"⭐ 次の目的地":"📍 探索地域"}</b><br>
     <small>${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</small><br><br>
     <button onclick="setNext('${p.id}')">${p.next?"選択中":"次の目的地にする"}</button>
     <button onclick="toggleVisited('${p.id}')">${p.visited?"未探索に戻す":"探索済みにする"}</button>
   `);
   markers.set(p.id,marker);
 });
}
map.on("click",e=>{
 const p={id:crypto.randomUUID(),lat:e.latlng.lat,lng:e.latlng.lng,next:false,visited:false};
 places.push(p);save();render();markers.get(p.id).openPopup();
});
window.setNext=function(id){
 places.forEach(p=>p.next=p.id===id);save();render();
 const p=places.find(p=>p.id===id);
 if(p) map.setView([p.lat,p.lng],14);
};
window.toggleVisited=function(id){
 const p=places.find(p=>p.id===id);
 if(p){p.visited=!p.visited;save();render();}
};
document.getElementById("randomBtn").onclick=()=>{
 const candidates=places.filter(p=>!p.visited);
 if(!candidates.length){alert("未探索の探索地域がありません。");return;}
 const p=candidates[Math.floor(Math.random()*candidates.length)];
 places.forEach(x=>x.next=x.id===p.id);
 save();render();map.setView([p.lat,p.lng],14);
 markers.get(p.id).openPopup();
};
let watchId=null;
let currentMarker=null;
let currentAccuracy=null;

function updateCurrentPosition(pos){
 const lat=pos.coords.latitude, lng=pos.coords.longitude;
 if(currentMarker){currentMarker.setLatLng([lat,lng]); currentAccuracy.setLatLng([lat,lng]); currentAccuracy.setRadius(pos.coords.accuracy||30);}
 else{
   currentAccuracy=L.circle([lat,lng],{radius:pos.coords.accuracy||30,weight:1,fillOpacity:.08}).addTo(map);
   currentMarker=L.circleMarker([lat,lng],{radius:8,weight:3,fillOpacity:.9}).addTo(map).bindPopup("現在地");
 }
 map.setView([lat,lng],16);
}

function startLocation(){
 if(!window.isSecureContext){alert("現在地機能にはHTTPS接続が必要です。Safariで公開URLを開いてください。");return;}
 if(!navigator.geolocation){alert("このブラウザでは現在地取得に対応していません。");return;}
 const btn=document.getElementById("locBtn");
 btn.textContent="現在地取得中…";
 if(watchId!==null) navigator.geolocation.clearWatch(watchId);
 navigator.geolocation.getCurrentPosition(updateCurrentPosition,err=>{
   if(err.code===1) alert("位置情報が許可されていません。iPhoneの設定でSafariの位置情報を「このAppの使用中」にしてください。");
   else if(err.code===2) alert("現在地を取得できませんでした。GPSを受信しやすい場所でもう一度試してください。");
   else alert("現在地の取得がタイムアウトしました。もう一度試してください。");
 },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
 watchId=navigator.geolocation.watchPosition(updateCurrentPosition,err=>{
   if(err.code===1){alert("位置情報が許可されていません。設定からSafariの位置情報を許可してください。"); if(watchId!==null) navigator.geolocation.clearWatch(watchId); watchId=null;}
 },{enableHighAccuracy:true,timeout:30000,maximumAge:5000});
 btn.textContent="現在地追跡中";
}

document.getElementById("locBtn").onclick=startLocation;
const sheet=document.getElementById("sheet"),items=document.getElementById("items");
function showList(){
 items.innerHTML="";
 if(!places.length){
   items.innerHTML="<p class='meta'>まだ探索地域がありません。地図をタップしてください。</p>";
 }else{
   places.forEach(p=>{
     const row=document.createElement("div");row.className="item";
     const info=document.createElement("div");
     info.innerHTML=`<b>${p.next?"⭐ ":"📍 "}探索地域</b><div class="meta">${p.visited?"探索済み":"未探索"}${p.next?" ・ 次の目的地":""}</div>`;
     const actions=document.createElement("div");
     const next=document.createElement("button");next.textContent=p.next?"選択中":"次へ";
     next.onclick=()=>{setNext(p.id);showList();};
     const del=document.createElement("button");del.textContent="削除";del.style.background="#c62828";
     del.onclick=()=>{if(confirm("この探索地域を削除しますか？")){places=places.filter(x=>x.id!==p.id);save();render();showList();}};
     actions.append(next,del);row.append(info,actions);items.append(row);
   });
 }
 sheet.style.display="flex";
}
document.getElementById("listBtn").onclick=showList;
document.getElementById("closeBtn").onclick=()=>sheet.style.display="none";
sheet.onclick=e=>{if(e.target===sheet)sheet.style.display="none"};
render();
</script>
</body>
</html>
